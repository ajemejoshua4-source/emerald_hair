services:
  - type: web
    name: emerald-hair
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: emerald-hair-db
          property: connectionString
      - key: APP_KEY
        sync: false
      - key: EMERALD_WHATSAPP
        value: "2347069133416"
      - key: EMERALD_INSTAGRAM
        value: "https://instagram.com/emeraldhair"
      - key: EMERALD_EMAIL
        value: "ajemeoluchi@gmail.com"
databases:
  - name: emerald-hair-db
    plan: free
