services:
  - type: web
    name: emerald-hair
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Emerald Hair"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: emerald-hair-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: EMERALD_WHATSAPP
        value: "2347069133416"
      - key: EMERALD_INSTAGRAM
        value: "https://instagram.com/emeraldhair"
      - key: EMERALD_EMAIL
        value: "ajemeoluchi@gmail.com"
      - key: EMERALD_ADMIN_PASSWORD
        sync: false
databases:
  - name: emerald-hair-db
    plan: free
    databaseName: emerald_hair
    user: emerald
